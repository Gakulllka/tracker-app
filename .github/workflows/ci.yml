# CI: проверка типов и юнит-тесты на каждый push/PR (блокирующие),
# линт информационный, смоук-тесты Playwright — опционально (нужна живая база).
name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  typecheck:
    name: TypeScript + юнит-тесты + ESLint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prisma generate
        run: npx prisma generate

      - name: TypeScript (блокирующая проверка)
        run: npx tsc --noEmit

      # Юнит-тесты чистых модулей: lib/task-import, lib/excel-import, lib/metrics.
      # База и браузер не нужны — запускаются встроенным движком Node.
      - name: Юнит-тесты (блокирующая проверка)
        run: npm test

      # Унаследованные предупреждения react-hooks/set-state-in-effect
      # (правило появилось в React 19). Линт информационный, чтобы не
      # блокировать деплой из-за старого кода — см. AGENTS.md, раздел 11.
      - name: ESLint (информационно)
        run: npx eslint src || echo "::warning::ESLint нашёл проблемы — смотри лог выше"

  smoke:
    name: Смоук-тесты (Playwright)
    runs-on: ubuntu-latest
    # Запускается только если в Settings → Secrets задан TEST_DATABASE_URL —
    # тестам нужна живая база (можно отдельную ветку Supabase).
    if: ${{ vars.RUN_SMOKE_TESTS == 'true' }}
    env:
      DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
      DIRECT_URL: ${{ secrets.TEST_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright
        run: |
          npm i -D @playwright/test
          npx playwright install --with-deps chromium

      - name: Prisma generate
        run: npx prisma generate

      - name: Build
        run: npm run build

      - name: Run smoke tests
        run: npm run test:e2e
